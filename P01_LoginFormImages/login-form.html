<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Form | Flat Business Profile Widget</title>
  <link rel="stylesheet" href="login-form.css">
</head>
<body>
  <main>
    <div class="image-container">
      <img class="profile-image" src="images/image-photo.jpg" alt="Profile">
    </div>

    <header class="widget-header">
      <h1>Login Form</h1>
      <p>Flat Business Profile Widget</p>
    </header>

    <form action="#" method="post">
      <div class="form-field">
        <label class="visually-hidden" for="username">Username</label>
        <img src="images/user.png" alt="" aria-hidden="true">
        <input id="username" name="username" type="text" placeholder="Username"
               autocomplete="username" required>
      </div>

      <div class="form-field">
        <label class="visually-hidden" for="password">Password</label>
        <img src="images/pass.png" alt="" aria-hidden="true">
        <input id="password" name="password" type="password" placeholder="Password"
               autocomplete="current-password" required>
      </div>

      <input type="submit" value="Log in">
    </form>

    <footer>
      <p>&copy; 2016 Flat Business Profile Widget. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
